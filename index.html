<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHINSA Cloud Antivirus</title>

  <!-- iOS Safari PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHINSA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="SHINSA">

  <!-- Application Icons -->
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="shortcut icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      object-fit: cover;
      border: 2px solid #1e293b;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .upload-area {
      border: 2px dashed #475569;
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      background: #0f172a;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .upload-area:active {
      border-color: #38bdf8;
      background: #131d31;
    }

    .upload-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .file-input {
      display: none;
    }

    .file-details {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 10px;
      word-break: break-all;
      display: none;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .btn-scan {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .btn-scan:active {
      transform: scale(0.98);
    }

    .btn-scan:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status-panel {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      background: #0f172a;
      border: 1px solid #334155;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="/apple-touch-icon.png" alt="SHINSA Logo" class="app-logo" onerror="this.style.display='none'">
      <h1>SHINSA CLOUD</h1>
      <p>Real-Time Threat Intelligence & Analysis</p>
    </div>

    <div class="card">
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">🛡️</div>
        <div class="upload-text" id="uploadLabel">Tap to select a file for scanning</div>
        <div class="file-details" id="fileDetails"></div>
        <input type="file" id="fileInput" class="file-input" onchange="handleFileSelected(event)">
      </div>

      <button id="scanBtn" class="btn-scan" onclick="startCloudScan()" disabled>Start Cloud Analysis</button>

      <div id="statusPanel" class="status-panel"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SHINSA Service Worker active:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }

    let selectedFile = null;

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        document.getElementById('uploadLabel').innerText = 'File ready for analysis';
        const details = document.getElementById('fileDetails');
        details.style.display = 'block';
        details.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        document.getElementById('scanBtn').removeAttribute('disabled');
      }
    }

    async function computeSHA256(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function startCloudScan() {
      if (!selectedFile) return;

      const scanBtn = document.getElementById('scanBtn');
      const statusPanel = document.getElementById('statusPanel');

      scanBtn.disabled = true;
      scanBtn.innerText = 'Analyzing File...';
      statusPanel.style.display = 'block';
      statusPanel.style.borderColor = '#334155';
      statusPanel.innerHTML = '<span style="color: #38bdf8;">⏳ Computing SHA-256 hash & querying threat cloud...</span>';

      try {
        const fileHash = await computeSHA256(selectedFile);

        const response = await fetch('https://shinsa.com.au/api/v1/scan-hash', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            hash: fileHash,
            file_name: selectedFile.name
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();

        if (data.is_malicious) {
          statusPanel.style.borderColor = '#ef4444';
          statusPanel.innerHTML = `
            <div style="color: #ef4444; font-weight: bold; margin-bottom: 6px;">⚠️ Threat Detected!</div>
            <div><strong>Detection:</strong> ${data.threat_name || 'Generic.Malware'}</div>
            <div style="margin-top: 4px; font-size: 11px; color: #94a3b8;">Hash: ${fileHash.substring(0, 24)}...</div>
          `;
        } else {
          statusPanel.style.borderColor = '#10b981';
          statusPanel.innerHTML = `
            <div style="color: #10b981; font-weight: bold; margin-bottom: 6px;">✅ Clean File</div>
            <div style="font-size: 12px; color: #94a3b8;">No matching threat signatures found in the database.</div>
            <div style="margin-top: 4px; font-size: 11px; color: #64748b;">Hash: ${fileHash.substring(0, 24)}...</div>
          `;
        }
      } catch (err) {
        statusPanel.style.borderColor = '#ef4444';
        statusPanel.innerHTML = `<span style="color: #ef4444;">❌ Scan failed: ${err.message || 'Network error'}</span>`;
      } finally {
        scanBtn.removeAttribute('disabled');
        scanBtn.innerText = 'Analyze Another File';
      }
    }
  </script>
</body>
</html>
